# ML-Enhanced Forex Signal Engine Configuration

# Data Configuration
data:
  symbol: "EURUSD"
  timeframe: "1h"  # Options: 1m, 5m, 15m, 1h, 4h, 1d
  api_provider: "twelve_data"  # Options: twelve_data, alpha_vantage, csv
  api_key: "${FOREX_API_KEY}"  # Set in .env file
  historical_bars: 5000
  data_path: "data/raw"

# Feature Engineering
features:
  lagged_returns: [1, 3, 5]
  rolling_windows: [10, 20, 50]
  indicators:
    - "sma"
    - "rsi"
    - "atr"
  target_horizon: 1  # Predict next N bars

# Model Training
model:
  type: "logistic_regression"  # Options: logistic_regression, random_forest, lstm, kan
  train_test_split: 0.8  # 80% train, 20% test
  validation_split: 0.2  # From training data
  random_state: 42

  # Model-specific parameters
  logistic_regression:
    C: 1.0
    max_iter: 1000

  random_forest:
    n_estimators: 100
    max_depth: 10
    min_samples_split: 5

  lstm:
    sequence_length: 50
    hidden_units: 64
    epochs: 50
    batch_size: 32

# Signal Generation
signals:
  thresholds:
    buy_probability: 0.6  # P(up) > 0.6 → BUY
    sell_probability: 0.4  # P(up) < 0.4 → SELL

  risk_management:
    stop_loss_atr_multiplier: 2.0
    take_profit_atr_multiplier: 3.0
    default_atr_period: 14

  output_format: "both"  # Options: json, csv, both
  output_path: "outputs"

# Backtesting
backtest:
  initial_capital: 10000.0
  position_size: 1.0  # Lot size or percentage
  commission: 0.0002  # 2 pips spread/commission
  slippage: 0.0001  # 1 pip slippage

  # Execution assumptions
  entry_type: "next_open"  # Enter at next bar's open
  exit_type: "sl_tp_or_close"  # Exit at SL, TP, or bar close

  # Reporting
  plot_equity_curve: true
  plot_drawdown: true
  save_trade_history: true

# Date Ranges (for backtesting)
dates:
  train_start: "2020-01-01"
  train_end: "2023-12-31"
  test_start: "2024-01-01"
  test_end: "2024-11-17"

# Paths
paths:
  models: "models"
  data: "data"
  outputs: "outputs"
  logs: "logs"
